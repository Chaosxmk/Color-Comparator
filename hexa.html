<!DOCTYPE html>
<html class="min-vh-100" lang="en-gb" dir="ltr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
  <meta charset="utf-8"/>
  <title>Color comparator</title>
  <link href="favicon/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
  <link href="favicon/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="style/general.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.css"/>
  <script src="https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js"></script>
  <script src="script/hexa.js" type="module"></script>
</head>
<body class="vh-100 d-flex p-3 flex-column">
  <nav class="position-fixed top-0 start-0 m-3">
    <a href="./basic.html" class="btn btn-primary btn-sm">Basic mode</a>
    <a href="./advanced.html" class="btn btn-primary btn-sm">Advanced mode</a>
  </nav>

  <main class="my-auto position-relative">
    <form class="container container-fluid p-3 border rounded bg-light">
      <div class="row align-items-center g-3">
        <div class="col-lg col-sm-6 col-12">
          <div class="form-floating">
            <input type="text" class="form-control hex-colors" id="hexa" data-target="#rgba" data-paint=".color" maxlength="9" placeholder="HexA">
            <label for="hexa">Hexa</label>
          </div>
        </div>

        <div class="col-lg col-sm-6 col-12">
          <div class="form-floating">
            <input type="text" class="form-control rgb-colors" id="rgba" data-target="#hexa" data-paint=".color" placeholder="RGBA">
            <label for="rgba">RGBA</label>
          </div>
        </div>
      </div>
    </form>
  </main>

  <aside class="w-100 h-100 position-fixed top-0 start-0">
    <div class="color w-100 h-100"></div>
  </aside>
</body>
</html>
